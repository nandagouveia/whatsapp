services:
  - type: web
    name: profanus-pix
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT server:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: PUBLIC_URL
        sync: false
      - key: PROFANUS_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PIX_AMOUNT
        value: '20.00'
      - key: VIDEO_BUCKET
        value: videos-pagos
      - key: VIDEO_PATH
        value: completo.mp4
